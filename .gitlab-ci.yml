variables:
    PLUGIN_NAME: 'OASwitchboard'

include:
  - project: 'documentacao-e-tarefas/modelosparaintegracaocontinua'
    ref: stable-3_3_0
    file:
      - 'templates/groups/pkp_plugin.yml'
      - 'templates/groups/ojs/unit_tests.yml'
      - 'templates/groups/ojs/cypress_tests.yml'

.unit_test_template:
  before_script:
    - rm -rf lib/APIKeyEncryption
    - git submodule update --init --depth 1
    # Salt used to encrypt the credentials in the test installation. It is not a
    # secret: it exists so that the encryption has a key, and is public on purpose.
    - TEST_API_KEY_SECRET=$(printf 'ci_test_salt' | base64)
    - sed -i "s|api_key_secret = \"\"|api_key_secret = \"$TEST_API_KEY_SECRET\"|" /var/www/ojs/config.inc.php

.integration_tests_template:
  before_script:
    - rm -rf lib/APIKeyEncryption
    - git submodule update --init --depth 1
    - export CYPRESS_OASPassword="$(echo $CYPRESS_OASPassword | base64 -d)"
    # Salt used to encrypt the credentials in the test installation. It is not a
    # secret: it exists so that the encryption has a key, and is public on purpose.
    - TEST_API_KEY_SECRET=$(printf 'ci_test_salt' | base64)
    - sed -i "s|api_key_secret = \"\"|api_key_secret = \"$TEST_API_KEY_SECRET\"|" /var/www/ojs/config.inc.php
    # The sandbox API is selected only through config.inc.php, never in the settings form.
    - printf '\n[oaswitchboard]\nsandbox = On\n' >> /var/www/ojs/config.inc.php

# Skip running Cypress tests on OJS (workaround)
ojs_integration_tests:
  rules:
    - when: never